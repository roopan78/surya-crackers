<section appScrollReveal>
  <p class="section-eyebrow text-center">Our Promise</p>
  <h2 class="section-heading mt-1 text-center">Why Choose Surya Crackers</h2>

  <div class="mt-8 grid gap-5 sm:grid-cols-3">
    @for (reason of reasons; track reason.title) {
      <div class="glass-card-solid hover-lift flex flex-col items-center gap-3 p-7 text-center">
        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-red-soft text-brand-red">
          <lucide-icon [img]="reason.icon" class="h-7 w-7" />
        </div>
        <h3 class="text-base font-bold text-brand-charcoal">{{ reason.title }}</h3>
        <p class="text-sm leading-relaxed text-brand-ink-secondary">{{ reason.description }}</p>
      </div>
    }
  </div>
</section>
