<div class="inline-flex items-center gap-3 rounded-2xl border border-black/10 bg-white px-2 py-1">
  <button
    type="button"
    class="flex h-7 w-7 items-center justify-center rounded-xl text-brand-ink-secondary transition hover:bg-brand-mist hover:text-brand-red disabled:cursor-not-allowed disabled:opacity-40"
    [disabled]="disableDecrement()"
    (click)="decrement.emit()"
    aria-label="Decrease quantity"
  >
    <lucide-icon [img]="MinusIcon" class="h-4 w-4" />
  </button>
  <span class="w-6 text-center text-sm font-semibold text-brand-charcoal">{{ quantity() }}</span>
  <button
    type="button"
    class="flex h-7 w-7 items-center justify-center rounded-xl text-brand-ink-secondary transition hover:bg-brand-mist hover:text-brand-red"
    (click)="increment.emit()"
    aria-label="Increase quantity"
  >
    <lucide-icon [img]="PlusIcon" class="h-4 w-4" />
  </button>
</div>
