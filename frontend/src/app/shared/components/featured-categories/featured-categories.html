<section appScrollReveal>
  <p class="section-eyebrow text-center sm:text-left">Explore</p>
  <h2 class="section-heading mt-1 text-center sm:text-left">Featured Categories</h2>

  <div class="mt-6 grid grid-cols-2 gap-4 sm:grid-cols-4">
    @for (category of categories().slice(0, 8); track category.id) {
      <button
        type="button"
        class="glass-card-solid hover-lift group flex flex-col items-center gap-3 overflow-hidden p-4 text-center"
        (click)="selected.emit(category)"
      >
        <div class="h-20 w-20 overflow-hidden rounded-2xl bg-brand-mist sm:h-24 sm:w-24">
          <img
            [src]="category.image | cdnImage: 600"
            [alt]="category.name"
            loading="lazy"
            class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
          />
        </div>
        <span class="text-sm font-semibold text-brand-charcoal">{{ category.name }}</span>
      </button>
    }
  </div>
</section>
