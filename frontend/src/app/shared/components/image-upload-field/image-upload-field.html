<div>
  <label class="field-label">{{ label() }}</label>
  <div class="flex items-center gap-3">
    <div class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-2xl border border-dashed border-black/15 bg-brand-mist">
      @if (value) {
        <img [src]="value" alt="Preview" class="h-full w-full object-cover" />
      } @else {
        <lucide-icon [img]="ImagePlusIcon" class="h-6 w-6 text-brand-ink-muted" />
      }
    </div>
    <div class="flex flex-1 flex-col gap-2">
      <input
        type="file"
        accept="image/*"
        class="block w-full text-xs text-brand-ink-muted file:mr-3 file:rounded-lg file:border-0 file:bg-brand-mist file:px-3 file:py-1.5 file:text-xs file:font-semibold file:text-brand-charcoal hover:file:bg-black/10"
        (change)="onFileSelected($event)"
      />
      <input
        type="text"
        placeholder="or paste an image URL"
        class="input-field !py-1.5 text-xs"
        [ngModel]="value"
        (ngModelChange)="onUrlInput($event)"
      />
    </div>
  </div>
</div>
