<!-- Sits well clear of the bottom edge below `lg`: Quick Order pins its
     order-summary bar there on small screens. -->
@if (visible()) {
  <button
    type="button"
    (click)="jumpToTop()"
    aria-label="Back to top"
    title="Back to top"
    class="animate-fab-in fixed bottom-24 right-4 z-40 flex h-11 w-11 items-center justify-center rounded-full border border-black/10 bg-white/85 text-brand-charcoal shadow-lg shadow-black/15 backdrop-blur-xl transition duration-200 hover:-translate-y-0.5 hover:bg-white hover:text-brand-red active:translate-y-0 active:scale-95 lg:bottom-8 lg:right-8"
  >
    <lucide-icon [img]="ArrowUpIcon" class="h-5 w-5" aria-hidden="true" />
  </button>
}
