<div
  class="flex items-start gap-3 rounded-xl border border-red-900/50 bg-gradient-to-r from-red-950/40 to-amber-950/20 p-4"
  [class.sm:p-5]="!compact()"
>
  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-red-600/20 text-red-500">
    <lucide-icon [img]="ShieldAlertIcon" class="h-5 w-5" />
  </div>
  <div>
    <p class="text-sm font-bold uppercase tracking-wide text-red-400">Safety First</p>
    <p class="mt-1 text-sm leading-relaxed text-slate-300">{{ message() }}</p>
  </div>
</div>
