<div
  class="glass-card-solid flex items-start gap-3 border-brand-red/15 bg-brand-red-soft/60 p-4"
  [class.sm:p-5]="!compact()"
>
  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-red/10 text-brand-red">
    <lucide-icon [img]="ShieldAlertIcon" class="h-5 w-5" />
  </div>
  <div>
    <p class="text-xs font-bold uppercase tracking-widest text-brand-red">Safety First</p>
    <p class="mt-1 text-sm leading-relaxed text-brand-ink-secondary">{{ message() }}</p>
  </div>
</div>
