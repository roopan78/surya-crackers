<div class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex flex-col items-center gap-2 px-4 sm:items-end sm:px-6">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="glass-card-solid animate-toast-in pointer-events-auto flex w-full max-w-sm items-start gap-3 p-4"
      [class]="accentClass(toast.type)"
    >
      <lucide-icon [img]="iconFor(toast.type)" class="toast-icon mt-0.5 h-5 w-5 shrink-0" />
      <p class="flex-1 text-sm font-medium text-brand-charcoal">{{ toast.message }}</p>
      <button type="button" class="text-brand-ink-muted hover:text-brand-charcoal" (click)="dismiss(toast.id)" aria-label="Dismiss">
        <lucide-icon [img]="XIcon" class="h-4 w-4" />
      </button>
    </div>
  }
</div>
