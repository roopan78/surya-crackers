<header class="glass-nav sticky top-0 z-40">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
    <a routerLink="/" class="flex shrink-0 items-center gap-2">
      <span class="flex h-9 w-9 items-center justify-center rounded-2xl bg-brand-charcoal shadow-md shadow-brand-charcoal/20">
        <lucide-icon [img]="FlameIcon" class="h-5 w-5 text-brand-gold" />
      </span>
      <span class="font-[family-name:--font-display] text-lg font-extrabold tracking-tight text-brand-charcoal">
        Surya <span class="text-brand-red">Crackers</span>
      </span>
    </a>

    <nav class="hidden items-center gap-1 text-sm font-semibold text-brand-ink-secondary sm:flex">
      <a routerLink="/" class="btn-ghost">Home</a>
    </nav>

    <div class="flex flex-1 items-center justify-end gap-2">
      @if (searchOpen()) {
        <form class="hidden items-center sm:flex" (ngSubmit)="submitSearch()">
          <input
            #searchInput
            type="search"
            [(ngModel)]="searchTerm"
            name="search"
            placeholder="Search fireworks…"
            aria-label="Search fireworks"
            class="input-field !w-56 !py-2"
          />
          <button type="submit" class="sr-only">Search</button>
        </form>
      }
      <button type="button" class="btn-ghost !p-2.5" (click)="toggleSearch()" aria-label="Toggle search">
        <lucide-icon [img]="searchOpen() ? XIcon : SearchIcon" class="h-4.5 w-4.5" />
      </button>

      <a
        [routerLink]="customerAuthService.isAuthenticated() ? '/account' : '/login'"
        class="btn-ghost !p-2.5"
        [attr.aria-label]="customerAuthService.isAuthenticated() ? 'My Account' : 'Sign In'"
      >
        <lucide-icon [img]="UserIcon" class="h-4.5 w-4.5" />
      </a>

      <a routerLink="/checkout" class="btn-secondary relative !px-3 !py-2">
        <lucide-icon [img]="ShoppingCartIcon" class="h-4 w-4" />
        <span class="hidden sm:inline">Cart</span>
        @if (cartService.totalBoxes() > 0) {
          <span
            class="absolute -right-2 -top-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-brand-red px-1 text-[11px] font-bold text-white shadow-sm"
          >
            {{ cartService.totalBoxes() }}
          </span>
        }
      </a>
    </div>
  </div>

  @if (searchOpen()) {
    <form class="border-t border-black/5 px-4 py-2.5 sm:hidden" (ngSubmit)="submitSearch()">
      <input
        #searchInput
        type="search"
        [(ngModel)]="searchTerm"
        name="search-mobile"
        placeholder="Search fireworks…"
        aria-label="Search fireworks"
        class="input-field"
      />
      <button type="submit" class="sr-only">Search</button>
    </form>
  }
</header>
