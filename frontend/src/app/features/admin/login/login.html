<div class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden bg-brand-charcoal px-4 py-10">
  <div class="pointer-events-none absolute -right-24 -top-24 h-72 w-72 rounded-full bg-brand-gold/15 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-24 -left-24 h-72 w-72 rounded-full bg-brand-red/20 blur-3xl"></div>

  <div class="relative mb-6 text-center">
    <p class="text-xs font-bold uppercase tracking-widest text-brand-gold">Surya Crackers</p>
    <h1 class="mt-1 font-[family-name:--font-display] text-2xl font-extrabold tracking-tight text-white">Admin Workspace Login</h1>
  </div>

  <div class="glass-card relative w-full max-w-sm border-white/10 bg-white/[0.06] p-6" style="backdrop-filter: blur(24px)">
    <form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="submit()">
      <div>
        <label class="field-label !text-white/50" for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="input-field !border-white/15 !bg-white/10 !text-white placeholder-white/30"
          placeholder="admin"
          autocomplete="username"
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <p class="field-error">Username is required.</p>
        }
      </div>

      <div>
        <label class="field-label !text-white/50" for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="input-field !border-white/15 !bg-white/10 !text-white placeholder-white/30"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <p class="field-error">Password is required.</p>
        }
      </div>

      @if (loginError()) {
        <p class="field-error flex items-center gap-1.5">
          <lucide-icon [img]="TriangleAlertIcon" class="h-3.5 w-3.5 shrink-0" />
          {{ loginError() }}
        </p>
      }

      <button type="submit" class="btn-primary mt-1" [disabled]="submitting()">
        <lucide-icon [img]="LogInIcon" class="h-4 w-4" />
        {{ submitting() ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>

  <a routerLink="/" class="relative mt-6 text-xs font-medium text-white/40 hover:text-white/70">Back to Storefront</a>
</div>
