<div class="flex min-h-screen bg-brand-mist">
  <!-- Sidebar -->
  <aside class="hidden w-64 shrink-0 flex-col border-r border-black/5 bg-white/80 backdrop-blur-xl sm:flex">
    <div class="border-b border-black/5 px-5 py-5">
      <p class="text-xs font-bold uppercase tracking-widest text-brand-gold">Surya Crackers</p>
      <p class="font-[family-name:--font-display] text-sm font-bold text-brand-charcoal">Admin Workspace</p>
      @if (currentUser()) {
        <p class="mt-1 text-xs text-brand-ink-muted">Signed in as {{ currentUser()?.name || currentUser()?.email }}</p>
      }
    </div>

    <nav class="flex flex-1 flex-col gap-1 p-3">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="!bg-brand-charcoal !text-white shadow-md shadow-brand-charcoal/20"
          [routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
          class="flex items-center gap-3 rounded-2xl border border-transparent px-3 py-2.5 text-sm font-medium text-brand-ink-secondary transition hover:bg-black/5 hover:text-brand-charcoal"
        >
          <lucide-icon [img]="item.icon" class="h-4 w-4" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-black/5 p-3">
      <a
        routerLink="/"
        class="flex items-center gap-2 rounded-2xl px-3 py-2.5 text-sm font-medium text-brand-ink-secondary transition hover:bg-black/5 hover:text-brand-charcoal"
      >
        <lucide-icon [img]="ExternalLinkIcon" class="h-4 w-4" />
        Back to Storefront
      </a>
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-2 rounded-2xl px-3 py-2.5 text-sm font-medium text-brand-red/80 transition hover:bg-brand-red-soft hover:text-brand-red"
      >
        <lucide-icon [img]="LogOutIcon" class="h-4 w-4" />
        Log Out
      </button>
    </div>
  </aside>

  <!-- Mobile top nav -->
  <nav class="scrollbar-thin glass-nav fixed inset-x-0 top-0 z-30 flex gap-2 overflow-x-auto px-3 py-2 sm:hidden">
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="!bg-brand-charcoal !text-white"
        [routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
        class="flex shrink-0 items-center gap-1.5 rounded-full border border-black/10 bg-white px-3 py-1.5 text-xs font-medium text-brand-ink-secondary"
      >
        <lucide-icon [img]="item.icon" class="h-3.5 w-3.5" />
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Content -->
  <main class="min-w-0 flex-1 px-4 py-6 pt-16 sm:px-8 sm:py-8 sm:pt-8">
    <router-outlet />
  </main>
</div>
